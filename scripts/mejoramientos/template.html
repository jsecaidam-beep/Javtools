 {id:'agua-almacenamiento',kind:'water',title:'Agua y almacenamiento',location:'Municipio de Chiquimula',seconds:14,works:['limar-agua','brisas']},
 {id:'rodeo',kind:'rodeo',title:'Centro comunitario El Rodeo',location:'Municipio de Camotán · Chiquimula',coverage:'rodeo',seconds:12},
 {id:'cierre',kind:'closing',title:'Seguimos construyendo bienestar',seconds:10},
];
const duration=slides.reduce((s,x)=>s+x.seconds,0);let current=0,elapsed=0,playing=true,lastTime=0,raf=0,quietTimer,toastTimer;let suspended=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coverage=id=>COVERAGE.find(x=>x.id===id);
const stats=id=>{const c=coverage(id);return c?`<div class="stats"><div class="stat glass rise"><strong data-count="${c.families}">${fmt(c.families)}</strong><span>familias</span></div><div class="stat glass rise"><strong data-count="${c.people}">${fmt(c.people)}</strong><span>habitantes</span></div></div>`:''};
const footer=()=>`<footer class="brand-footer"><img class="fhg" src="${ASSETS.fhg}" alt="Proyecto financiado por: Fondo Humanitario para Guatemala"><div class="footer-note">Proyecto implementado por Acción contra el Hambre.<br>Con el apoyo financiero del Fondo Humanitario para Guatemala.</div><img class="ach" src="${ASSETS.ach}" alt="Acción contra el Hambre"></footer>`;
const photo=(asset,alt,label,current=false,caption='')=>`<figure class="photo-panel glass rise"><img src="${ASSETS[asset]}" alt="${esc(alt)}" draggable="false"><span class="photo-label ${current?'current':''}">${esc(label)}</span>${caption?`<figcaption>${esc(caption)}</figcaption>`:''}</figure>`;
const drop=`<svg class="drop-symbol" viewBox="0 0 80 100" aria-hidden="true"><path d="M40 3C33 22 8 43 8 62a32 32 0 0 0 64 0C72 43 47 22 40 3Zm-15 63a16 16 0 0 0 16 16v5a21 21 0 0 1-21-21Z"/></svg>`;
function sceneMarkup(s){
 let html='';
 if(s.kind==='intro') html=`<div class="scene-body"><p class="eyebrow">Chiquimula · Guatemala</p></div><div class="intro-copy"><h1 class="h1 rise">Mejoramientos<br>que construyen<br><span class="highlight">bienestar.</span></h1><p class="rise">El registro inicial y los avances de nuestras obras en los territorios.</p><div class="tags rise"><span class="tag">Salud</span><span class="tag">Agua</span><span class="tag">Saneamiento</span></div></div><div class="intro-mosaic"><figure><img src="${ASSETS.chiquimulaProgress}" alt="Mejoramiento sanitario en el Centro de Salud de Chiquimula"><figcaption>Espacios de salud</figcaption></figure><figure><img src="${ASSETS.camotanProgress}" alt="Trabajos de instalación de tubería en Camotán"><figcaption>Agua y saneamiento</figcaption></figure></div><div class="intro-floating glass rise"><span>DEL REGISTRO INICIAL A LA OBRA</span>Antes → Avances</div>`;
 if(s.kind==='compare') html=`<div class="scene-body"><header class="case-head"><div><p class="eyebrow">Salud · Chiquimula</p><h2 class="h2 rise">${esc(s.title)}</h2><p class="case-location">${esc(s.location)}</p></div>${s.coverage?stats(s.coverage):'<span class="status-pill">Obra en ejecución</span>'}</header></div><div class="comparison">${photo(s.before,s.beforeAlt,'Antes')}${photo(s.progress,s.progressAlt,'Avances',true,'Obra en ejecución')}</div><div class="case-tail"><p>${esc(s.caption)}</p>${s.coverage?'<span class="status-pill">Obra en ejecución</span>':''}</div>`;
 if(s.kind==='phase') html=`<div class="scene-body case-phase"><p class="eyebrow">Obra en proceso · Registro inicial</p><h2 class="h2 rise">${esc(s.title)}</h2><p class="case-location">${esc(s.location)}</p><div class="phase-layout"><div class="phase-copy glass rise"><span class="status-pill">En proceso</span><h3 class="h3">${esc(s.heading)}</h3><p>${esc(s.caption)}</p>${s.coverage?stats(s.coverage):''}</div><div class="phase-images">${photo(s.before,s.beforeAlt,'Antes')}${photo(s.detail,s.detailAlt,'Antes · Detalle')}</div></div></div>`;
 if(s.kind==='water') html=`<div class="scene-body"><header class="water-head"><div><p class="eyebrow">Mejoramientos · Sistemas de agua</p><h2 class="h2 rise">${esc(s.title)}</h2><p class="case-location">${esc(s.location)}</p></div>${drop}</header><div class="water-grid ${s.works.length===2?'two':''}">${s.works.map(id=>{const c=coverage(id);return `<article class="water-card glass rise"><p class="card-kicker">${esc(c.type)}</p><h3>${esc(c.name)}</h3>${c.detail?`<p class="detail">${esc(c.detail)}</p>`:''}${stats(id)}</article>`}).join('')}</div></div><p class="water-footnote">Alcance informado por obra. Las cifras de las comunidades se presentan por separado.</p>`;
 if(s.kind==='rodeo') html=`<div class="scene-body"><p class="eyebrow">Salud · Municipio de Camotán</p><div class="rodeo-layout"><div><h2 class="h1 rise">El Rodeo.<br><span class="highlight">Una obra para<br>la comunidad.</span></h2><p class="rise">Mejoramiento del centro comunitario<br>El Rodeo, Camotán, Chiquimula.</p></div><div class="rodeo-stats glass rise">${stats(s.coverage)}<p>Alcance de la intervención<br>en la comunidad.</p></div></div></div>`;
 if(s.kind==='closing') html=`<div class="scene-body closing"><span class="big-flower" aria-hidden="true">✳</span><p class="eyebrow">Acción contra el Hambre · Guatemala</p><h2 class="h1 rise">Seguimos construyendo<br><span class="highlight">salud y bienestar.</span></h2><p class="thanks rise">Con las comunidades, desde los territorios.</p><div class="project glass rise"><span>En el marco del proyecto</span>Respuesta humanitaria multisectorial para salvar vidas frente a impactos del choque climático en cuatro municipios de Huehuetenango y Chiquimula.</div></div>`;
 return `<section class="scene ${esc(s.kind)}" aria-label="${esc(s.title)}"><div class="frame-line"></div>${html}${footer()}</section>`;
}
function announce(text){$('announcement').textContent=text}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;toastTimer=setTimeout(()=>$('toast').textContent='',5000)}
function render(){
 const host=$('scene'),old=host.firstElementChild;
 if(old){const clone=old.cloneNode(true);clone.className='scene-out';clone.setAttribute('aria-hidden','true');host.parentElement.append(clone);setTimeout(()=>clone.remove(),650)}
 host.innerHTML=sceneMarkup(slides[current]);
 document.title=slides[current].title+' · Mejoramientos ACH';
 if(!playing)announce(slides[current].title);
 $('previous').disabled=current===0;
 $('next').disabled=current===slides.length-1;
 $('slide-status').textContent=(current+1)+' / '+slides.length;
 document.querySelectorAll('#index-items button').forEach((button,i)=>button.setAttribute('aria-current',String(i===current)));
 document.querySelectorAll('.segment').forEach((button,i)=>{button.classList.toggle('done',i<current);button.setAttribute('aria-current',i===current?'step':'false');button.style.setProperty('--progress',i<current?'1':'0')});
 updatePlay();updateProgress();
 if(!reduce){const elements=host.querySelectorAll('[data-count]');const start=performance.now();function count(t){const fraction=Math.min(1,(t-start)/1050);const eased=1-Math.pow(1-fraction,3);elements.forEach(e=>e.textContent=fmt(Math.round(Number(e.dataset.count)*eased)));if(fraction<1 && elements[0]?.isConnected)requestAnimationFrame(count)}requestAnimationFrame(count)}
}
function jump(index){if(index<0||index>=slides.length)return;current=index;elapsed=0;lastTime=performance.now();render();wake()}
function updatePlay(){const ended=current===slides.length-1&&elapsed>=slides[current].seconds;$('play').innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg><span class="btn-text">Pausar</span>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m7 4 14 8-14 8z"/></svg><span class="btn-text">'+(ended?'Repetir':'Reproducir')+'</span>';$('play').setAttribute('aria-label',playing?'Pausar presentación':ended?'Repetir presentación':'Reproducir presentación')}
function toggle(){if(!playing&&current===slides.length-1&&elapsed>=slides[current].seconds)jump(0);playing=!playing;lastTime=performance.now();updatePlay();wake();announce(playing?'Reproducción automática':'Presentación pausada')}
function timeLabel(seconds){const n=Math.floor(seconds);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function updateProgress(){const passed=slides.slice(0,current).reduce((a,s)=>a+s.seconds,0)+elapsed;$('time').textContent=timeLabel(passed)+' / '+timeLabel(duration);const seg=$('segments').children[current];seg?.style.setProperty('--progress',String(Math.min(1,elapsed/slides[current].seconds)))}
function tick(t){if(!lastTime)lastTime=t;const delta=Math.min(.25,(t-lastTime)/1000);lastTime=t;if(playing&&!document.hidden){elapsed+=delta;if(elapsed>=slides[current].seconds){if(current<slides.length-1){current++;elapsed=0;render()}else{elapsed=slides[current].seconds;playing=false;updatePlay();wake();announce('Fin de la presentación')}}updateProgress()}raf=requestAnimationFrame(tick)}
function fit(){const space=document.querySelector('.stage-space');const box=space.getBoundingClientRect();const w=Math.min(box.width-22,(box.height-8)*16/9);const h=w*9/16;$('viewport').style.width=w+'px';$('viewport').style.height=h+'px';$('stage').style.setProperty('--scale',String(w/1600))}
new ResizeObserver(fit).observe(document.querySelector('.stage-space'));
function wake(){clearTimeout(quietTimer);$('screen').classList.remove('quiet');if(playing)quietTimer=setTimeout(()=>{if($('index').hidden)$('screen').classList.add('quiet')},3300)}
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement||$('screen').classList.contains('theater'))}
function syncFullscreen(){const active=isFullscreen();$('screen').classList.toggle('fullscreen',active);$('fullscreen').setAttribute('aria-label',active?'Salir de pantalla completa':'Activar pantalla completa');$('fullscreen').querySelector('span').textContent=active?'Salir de pantalla completa':'Pantalla completa';wake();fit()}
async function fullscreen(){try{if(isFullscreen()){if(document.fullscreenElement)await document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen();else $('screen').classList.remove('theater')}else{const el=$('screen');if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();else{el.classList.add('theater');notify('Modo presentación activo. Para ocultar las barras del navegador, usa su opción de pantalla completa.')}}}catch{notify('No se pudo activar pantalla completa. Intenta desde el menú de tu navegador.')}syncFullscreen()}
$('previous').onclick=()=>jump(current-1);$('next').onclick=()=>jump(current+1);$('play').onclick=toggle;$('restart').onclick=()=>{jump(0);playing=true;updatePlay();wake()};$('fullscreen').onclick=fullscreen;
$('share').onclick=async()=>{try{if(location.protocol==='file:'){notify('Este archivo funciona sin conexión. Comparte el enlace de JavTools para abrirlo en otros equipos.');return}await navigator.clipboard.writeText(location.href.split('#')[0]);notify('Enlace copiado. Se puede abrir en cualquier equipo.')}catch{notify('Copia la dirección de esta página para compartir la presentación.')}};
$('menu').onclick=()=>{const open=$('index').hidden;$('index').hidden=!open;$('menu').setAttribute('aria-expanded',String(open));if(open){suspended=playing;playing=false;updatePlay();$('index-items').querySelector('button[aria-current=true]')?.focus()}else if(suspended){playing=true;lastTime=performance.now();updatePlay();suspended=false}wake()};
$('segments').innerHTML=slides.map((s,i)=>`<button class="segment" aria-label="Ir a ${esc(s.title)}" data-index="${i}"></button>`).join('');$('index-items').innerHTML=slides.map((s,i)=>`<button data-index="${i}"><span>${String(i+1).padStart(2,'0')}</span>${esc(s.short||s.title)}</button>`).join('');
document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{jump(Number(b.dataset.index));if(!$('index').hidden){$('index').hidden=true;$('menu').setAttribute('aria-expanded','false');if(suspended){playing=true;lastTime=performance.now();updatePlay();suspended=false}$('menu').focus()}});
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLSelectElement||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='Escape'){if(!$('index').hidden){$('menu').click();return}if($('screen').classList.contains('theater')){$('screen').classList.remove('theater');syncFullscreen()}return}if((e.key===' '||e.key==='Spacebar')&&e.target instanceof HTMLButtonElement)return;if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='ArrowRight'){e.preventDefault();jump(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();jump(current-1)}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}else if(e.key==='Home'){e.preventDefault();jump(0)}else if(e.key==='End'){e.preventDefault();jump(slides.length-1)}});
document.addEventListener('visibilitychange',()=>{lastTime=performance.now()});document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('webkitfullscreenchange',syncFullscreen);document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);document.addEventListener('focusin',wake);window.addEventListener('resize',fit);
window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));
window.addEventListener('pageshow',e=>{if(e.persisted){cancelAnimationFrame(raf);lastTime=performance.now();raf=requestAnimationFrame(tick);fit()}});
render();fit();wake();
Promise.allSettled(Object.entries(ASSETS).filter(([k])=>k!=='font').map(([,src])=>{const im=new Image();im.src=src;return im.decode().catch(()=>{})})).then(()=>{lastTime=performance.now();raf=requestAnimationFrame(tick)});
</script>
